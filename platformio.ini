; ==========================================
; PlatformIO Configuration for FT8 Decoder
; ==========================================

[env:native]
; Linux/Mac testing environment
platform = native
build_type = release
build_flags = 
    -std=c++17
    -O3
    -fno-math-errno
    
build_src_filter = 
    +<*>
    -<sdkconfig>
    -<main.cpp>
lib_deps =
lib_archive = no
src_filter = 
    +<*>

debug_init_cmds =
    set args -file data/test_01.wav    

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Board-level settings
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
upload_speed = 921600
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder, time

; Source & library layout
; pio_sources.py adds decode_ft8.c, ft8/*.c, fft/*.c, common/*.c explicitly.
; This avoids PlatformIO accidentally compiling main.c, gen_ft8.c, etc.
; The repo root must be on the include path so #include "ft8/..." etc. work.

build_type = release

build_flags =
    -std=c++17
    -O3
    -ffast-math
    -fno-math-errno
    -DBOARD_HAS_PSRAM
    -DLOG_LEVEL=LOG_DEBUG
    -DCONFIG_WIFI_ENABLED=0
    -DCONFIG_BT_ENABLED=0
    
    ;-Wdouble-promotion  ; Uncomment when you do the final float migration!
    ;-mfix-esp32-psram-cache-issue ; Uncomment if your specific S3 board has PSRAM cache bugs

build_src_filter = 
    +<*>
    -<sdkconfig>
    -<main.cpp>



